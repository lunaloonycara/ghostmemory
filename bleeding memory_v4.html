<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bleeding Memory with Background Pulse</title>
  <style>
    body {
      background-color: white;
      font-family: 'Press Start 2P', 'Courier New', monospace;
      color: black;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      margin: 0;
      transition: background-color 1s ease;
    }

    .ghost-text {
      font-size: 1.5em;
      text-align: center;
      max-width: 90%;
      line-height: 2em;
      user-select: none;
      word-break: break-word;
    }

    .ghost-letter {
      display: inline-block;
      opacity: 1;
      transition: color 0.5s ease, opacity 0.5s ease, transform 0.5s ease;
      animation: flicker 3s infinite alternate;
      cursor: crosshair;
      will-change: transform, opacity, color;
    }

    @keyframes flicker {
      0% { opacity: 1; }
      30% { opacity: 0.7; }
      50% { opacity: 0.5; }
      80% { opacity: 0.8; }
      100% { opacity: 1; }
    }

    .bleeding {
      color: #FF0000;
      text-shadow: 0 0 5px #FF0000, 0 0 10px #FF3333;
      transform: scale(1.2) rotate(5deg);
    }

    .ghost-letter:hover, .ghost-letter:active {
      opacity: 0;
      transform: translateY(-20px) rotate(-10deg) scale(0.5);
      transition: all 0.8s ease;
    }
  </style>

  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

<div class="ghost-text" id="ghostText">
  Loading memory...
</div>

<script>
const fragments = [
  "on the street, banners of hope rose before the silence.",
  "she spoke her name once, before the sky shattered.",
  "the cities burned quietly in the memories they refused to archive.",
  "she vanished into the library of forbidden names.",
  "the asphalt bled, and history forgot who first sang.",
  "no cameras, no flags, only the smell of rain and smoke.",
  "the footprints erased by the algorithm of forgetting."
];

const ghostText = document.getElementById('ghostText');

function typeText(text, speed = 80) {
  ghostText.innerHTML = '';
  let i = 0;

  function typeLetter() {
    if (i < text.length) {
      const span = document.createElement('span');
      span.textContent = text[i];
      span.className = 'ghost-letter';
      ghostText.appendChild(span);
      i++;
      setTimeout(typeLetter, speed);
    } else {
      setTimeout(fadeOutText, 4000);
    }
  }

  typeLetter();
}

function fadeOutText() {
  const letters = document.querySelectorAll('.ghost-letter');
  letters.forEach((letter, index) => {
    setTimeout(() => {
      letter.style.opacity = '0';
      letter.style.transform = 'rotate(-5deg)';
      letter.style.color = 'white'; // Match the background color to make it blend in
      letter.style.transition = 'opacity 1s ease, color 1s ease'; // Smooth transition for both
    }, index * 30);
  });

  setTimeout(startNewFragment, 3000);
}

function startNewFragment() {
  const randomFragment = fragments[Math.floor(Math.random() * fragments.length)];
  typeText(randomFragment);
}

function bleedRandomLetter() {
  const letters = document.querySelectorAll('.ghost-letter');
  if (letters.length === 0) return;
  const randomIndex = Math.floor(Math.random() * letters.length);
  letters[randomIndex].classList.add('bleeding');
}

// BLEED BACKGROUND every 3 seconds
function pulseBackground() {
  document.body.style.backgroundColor = '#FF0000'; // faint red
  setTimeout(() => {
    document.body.style.backgroundColor = 'white';
  }, 1000); // flash duration
}

setInterval(pulseBackground, 3000);

// Other intervals
setInterval(bleedRandomLetter, 1000);
startNewFragment();
</script>

</body>
</html>
